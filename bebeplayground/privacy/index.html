<title>Privacy policy | Bebe Playground</title>
<script>
// 브라우저 언어(navigator.languages)에 맞는 페이지로 바로 이동한다.
// 쿠키·저장소·외부 요청은 쓰지 않는다. 맞는 언어가 없거나 스크립트가 꺼져 있으면 아래 목록에서 고른다.
(function () {
  var pages = { ko: "ko.html", en: "en.html", ja: "ja.html", id: "id.html", "in": "id.html", vi: "vi.html" };
  // 주소가 이미 언어 페이지면 이동하지 않는다. 서버가 없는 언어 파일 대신 이 페이지를 돌려줘도 되풀이 이동이 생기지 않게.
  if (/\/(ko|en|ja|id|vi)\.html$/i.test(location.pathname)) return;
  var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
  for (var i = 0; i < list.length; i++) {
    var code = String(list[i] || "").toLowerCase().split(/[-_]/)[0];
    if (Object.prototype.hasOwnProperty.call(pages, code)) {
      location.replace(pages[code]);
      return;
    }
  }
})();
</script>
